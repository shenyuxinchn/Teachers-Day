<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>教师节快乐</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        overflow-x: hidden;
        font-family: "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #e8f4fd, #f0f8ff);
        text-align: center;
    }

    .card {
        background: white;
        width: 92%;
        max-width: 420px;
        margin: 40px auto;
        padding: 40px 28px;
        border-radius: 22px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        box-sizing: border-box;
    }

    h1 {
        color: #4a90d9;
        font-size: 32px;
        margin-bottom: 12px;
    }

    .date {
        color: #999;
        font-size: 15px;
        margin-bottom: 22px;
    }

    .message {
        font-size: 18px;
        line-height: 1.8;
        color: #444;
        min-height: 140px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 8px;
    }

    .video-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 0 18px;
    }

    .video-box {
        width: 100%;
        max-width: 360px;
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 8px 24px rgba(74,144,217,0.25);
        box-sizing: border-box;
    }

    .video-box video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: #000;
    }

    button {
        background: #4a90d9;
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 30px;
        font-size: 17px;
        cursor: pointer;
        margin: 6px;
    }

    button:hover {
        background: #3a7bc8;
    }

    .hint {
        font-size: 14px;
        color: #888;
        margin-top: 16px;
    }

    .petal {
        position: fixed;
        top: -30px;
        width: 22px;
        height: 22px;
        background: #a8d4f0;
        border-radius: 50% 50% 50% 0;
        opacity: 0.8;
        animation: fall linear infinite;
        pointer-events: none;
        z-index: 1;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(720deg);
        }
    }

    .firework {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        animation: explode 1s ease-out forwards;
        z-index: 2;
        pointer-events: none;
    }

    @keyframes explode {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(30); opacity: 0; }
    }

    .footer {
        margin-top: 22px;
        font-size: 15px;
        color: #aaa;
    }

    #celebrateArea div {
        white-space: nowrap;
        text-align: center;
        font-size: clamp(28px, 7vw, 42px);
        font-weight: 400;
        margin-top: 20px;
        line-height: 1.2;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }
</style>
</head>

<body>

<script>
for (let i = 0; i < 20; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDuration = (Math.random() * 3 + 4) + "s";
    petal.style.width = petal.style.height = (Math.random() * 10 + 12) + "px";
    petal.style.opacity = Math.random() * 0.5 + 0.5;
    document.body.appendChild(petal);
}
</script>

<div class="card">
    <h1>🌸 老师您辛苦了 🌸</h1>
    <div class="date" id="date"></div>

    <div class="message" id="message">
        点击下方按钮，查看给孙老师的专属祝福 ❤️
    </div>

    <div class="video-wrap">
        <div class="video-box">
            <video id="greetVideo" controls preload="metadata" poster="cover.jpg" src="teacher_ios.mp4">
                你的浏览器不支持 HTML5 视频
            </video>
        </div>
    </div>

    <button onclick="showMessage()">换一句祝福</button>
    <button onclick="celebrate()">庆祝一下 🎉</button>

    <div id="celebrateArea"></div>

    <div class="hint">💡 点击视频播放祝福</div>

    <div class="footer">
        来自于爱您的徐梓彤同学
    </div>
</div>

<script>
    const messages = [
    "孙老师，我现在会数到100啦！都是您教我的，您太厉害了！",
    "孙老师，我最喜欢上数学课了！您教我们数小棒特别好玩～",
    "孙老师，我回家教妈妈算加法，妈妈都算不过我！谢谢孙老师！",
    "孙老师，您辛苦了！我以后要当数学家，第一个感谢的就是您！",
    "孙老师，您讲课的时候粉笔字写得可整齐了，我每次都照着学！",
    "孙老师，我保证以后算题不粗心，认真检查每一道题！",
    "孙老师，教师节快乐！我要用彩色笔画好多好多数字送给您～"
    ];

    function showMessage() {
        const msg = messages[Math.floor(Math.random() * messages.length)];
        document.getElementById("message").innerText = msg;
    }

    const today = new Date();
    document.getElementById("date").innerText =
        today.getFullYear() + "年" +
        (today.getMonth() + 1) + "月" +
        today.getDate() + "日";

    function celebrate() {
        for (let i = 0; i < 30; i++) {
            const fw = document.createElement("div");
            fw.className = "firework";
            fw.style.left = Math.random() * 100 + "vw";
            fw.style.top = Math.random() * 50 + "vh";
            fw.style.background = ["red","yellow","skyblue","purple","orange"][Math.floor(Math.random()*5)];
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1200);
        }

        document.getElementById("celebrateArea").innerHTML =
            `<div>🎉 老师您辛苦了 🎊</div>`;
    }
</script>

</body>
</html>
